services:
  db:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchmesh
      POSTGRES_DB: orchmesh
      POSTGRES_PASSWORD: ${ORCHMESH_DB_PASSWORD:?Set ORCHMESH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ORCHMESH_DB_PORT:-5433}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchmesh -d orchmesh"]
      interval: 3s
      timeout: 3s
      retries: 20
